[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-oss-trial"
version = "0.1.0"
description = "A small local Python todo CLI used as a learning project."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fsih1996" }]
keywords = ["cli", "learning", "todo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
codex-todo = "todo_cli:main"

[tool.setuptools]
py-modules = ["todo_cli", "hello"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
